<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>This is the Webpage for Form type</h1>
    </header>
    <main>
        <section>
            <form>
                <label for="fname">Enter your Name : </label>
                <input id="fname" name="fname" type="text"><br><br>
                <label for="mname">Whats your age?</label>
                <input id="mname" name="mname" type="number" ><br><br>
                <label >whats are your key skills ? </label><br><br>
                <input type="checkbox" name="skills" value="HTML"> HTML
                <input type="checkbox" name="skills" value="CSS"> CSS
                <input type="checkbox" name="skills" value="JS"> JS
                <input type="checkbox" name="skills" value="Python"> Python
                <input type="checkbox" name="skills" value="Java"> Java<br><br>
                <label for="gender">Gender : </label><br><br>
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female<br><br>
                <label for="country">Select your country : </label>
                <select name="country" id="country">
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                    <option value="Canada">Canada</option>
                    <option value="Japan">Japan</option>
                </select><br><br>
                <label for="message">Message : </label><br><br>
                <textarea name="message" id="message" cols="30" rows="10"></textarea><br><br>
                <input type="submit" value="Submit"><br><br>
                <label for="file">Upload your file : </label>
                <input type="file" name="file" id="file"><br><br>
                <label for="color">Select your favorite color : </label>
                <input type="color" name="color" id="color"><br><br>
                <label for="date">Select your date of birth : </label>
                <input type="date" name="date" id="date"><br><br>
                <label for="range">Select your range : </label>
                <input type="range" name="range" id="range" min="0" max="100"><br><br>
                <label for="email">Enter your email : </label>
                <input type="email" name="email" id="email"><br><br>
                <label for="password">Enter your password : </label>
                <input type="password" name="password" id="password"><br><br>
                <label for="tel">Enter your phone number : </label>
                <input type="tel" name="tel" id="tel"><br><br>
                <label for="url">Enter your website url : </label>
                <input type="url" name="url" id="url"><br><br>
                <label for="search">Search : </label>
                <input type="search" name="search" id="search"><br><br>
                <label for="time">Select your time : </label>
                <input type="time" name="time" id="time"><br><br>
                <label for="week">Select your week : </label>
                <input type="week" name="week" id="week"><br><br>
                <label for="month">Select your month : </label>
                <input type="month" name="month" id="month"><br><br>
                <label for="number">Enter your number : </label>
                <input type="number" name="number" id="number"><br><br>
            </form><br>
            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/Lnm3CVeLo7g?si=bw95LTfsZ-rXCrZ-"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </section>
    </main> 
</body>
</html>
